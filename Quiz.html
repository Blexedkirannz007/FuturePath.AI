<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuturePath AI - Assessment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FuturePath AI</h1>
            <p>Step 2: Enter your personal skill evaluations below.</p>
        </header>

        <main>
            <form id="predictionForm" class="card">
                <h2>Skill Profile</h2>
                
                <div class="form-group">
                    <label for="math_score">Mathematics Skill (1-10):</label>
                    <input type="number" id="math_score" min="1" max="10" required placeholder="e.g., 8">
                </div>

                <div class="form-group">
                    <label for="coding_score">Programming & Logic Skill (1-10):</label>
                    <input type="number" id="coding_score" min="1" max="10" required placeholder="e.g., 9">
                </div>

                <div class="form-group">
                    <label for="creativity_score">Creativity & Design Skill (1-10):</label>
                    <input type="number" id="creativity_score" min="1" max="10" required placeholder="e.g., 4">
                </div>

                <div class="form-group">
                    <label for="communication_score">Communication & Speaking (1-10):</label>
                    <input type="number" id="communication_score" min="1" max="10" required placeholder="e.g., 7">
                </div>

                <button type="submit" id="submitBtn">Analyze Profile</button>
                <a href="index.html" class="back-link">← Back to Home</a>
            </form>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
